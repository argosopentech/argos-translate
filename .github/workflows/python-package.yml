name: Unit tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARGOS_DEVICE_TYPE: cpu
      # Avoid SpaCy's import-time model download, even if defaults change.
      ARGOS_CHUNK_TYPE: ARGOSTRANSLATE

    steps:
      - name: Configure isolated Argos directories
        # Runner paths are only available after the job starts.
        run: |
          echo "XDG_DATA_HOME=$RUNNER_TEMP/argos-unit-tests/data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/argos-unit-tests/config" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/argos-unit-tests/cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest pytest-socket
      - name: Run offline unit tests
        # Explicit list prevents model demos/integration tests entering CI.
        run: >-
          python -m pytest --disable-socket -v
          tests/test_package.py
          tests/test_tokenizer.py
          tests/test_translate.py
